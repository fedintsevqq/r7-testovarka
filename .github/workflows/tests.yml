name: unit-tests

# Быстрый уровень: юнит-тесты (tests/test_*.py, ~600 на 29.09.2026; кроме
# tests/manual_cdp_smoke.py — оно намеренно не начинается с test_ и требует
# живой Р7-Офис, здесь не запускается). Живёт на GitHub-hosted раннере,
# отрабатывает за секунды — коннектор и psutil мокаются, реальный Р7 не
# нужен ни разу. Живой прогон на Р7 — отдельный уровень, perf.yml, требует
# self-hosted раннера с установленным Р7 (см. его комментарии).
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    # win32gui/win32con (pywin32) и часть кода r7_Testovarka.py — Windows-
    # специфичны (WIN32_OK-гейт в самом модуле переживает их отсутствие, но
    # раз тестовый стенд — Windows-приложение, честнее гонять CI там же, а
    # не притворяться кроссплатформенностью, которой нет).
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 — минимальная поддерживаемая, 3.14 — та, на которой инструмент
        # реально работает на стенде (.venv). Раньше CI гонял только 3.11.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock

      - name: pip-audit (известные уязвимости)
        # Падает, если в requirements.lock есть пакет с известной CVE.
        run: pip-audit -r requirements.lock --require-hashes --disable-pip

      - name: py_compile
        run: python -m py_compile r7_Testovarka.py r7_webdriver_connector.py

      - name: pyflakes
        run: python -m pyflakes r7_Testovarka.py r7_webdriver_connector.py r7_ops.py r7_reports.py r7 tests

      - name: Проверка WEBDRIVER_OK при импорте
        run: |
          python -c "import r7_Testovarka; assert r7_Testovarka.env.WEBDRIVER_OK, 'requests/websocket-client не установились из requirements.txt'"

      - name: pytest (с замером покрытия)
        # Источник — пакет r7 и модули рядом: после этапа 2 код живёт в r7/,
        # прежний --source=r7_Testovarka мерил только точку входа.
        run: python -m coverage run --branch --source=r7,r7_ops,r7_reports,r7_webdriver_connector,run_crash_recovery -m pytest tests -v

      - name: Покрытие (порог)
        # Порог 85 % — по факту на 07.10.2026 с запасом вниз на разницу
        # платформ; поднимается вместе с покрытием (docs/plan-to-10.md, шаг 4).
        # Отчёт по модулям — в сводку запуска.
        run: |
          "``````" >> $env:GITHUB_STEP_SUMMARY
          python -m coverage report --sort=cover | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          "``````" >> $env:GITHUB_STEP_SUMMARY
          python -m coverage report --skip-covered --sort=cover --fail-under=85
