name: build-exe

# Сборка портативного R7-Testovarka.exe и самопроверка собранного файла:
# PyInstaller молча теряет модули, импортируемые не напрямую, и папку
# шаблонов отчётов — без этой проверки это выяснялось у пользователя при
# первом отчёте (docs/plan-to-10.md, шаг 5).
#
# Рядом с .exe собирается архив «распаковал и запустил»
# R7-Testovarka-<версия>-win64.zip (docs/plan-to-20.md, этап 1, п. 5):
# .exe, его хеш, README на одну страницу, LICENSE и пустые папки
# Distributives/TestFiles/Reports. Версия — r7/version.py. На теге v<версия>
# .exe, хеш и архив уходят в GitHub Release; версия в теге обязана совпадать
# с r7/version.py, иначе сборка падает до релиза.
#
# К релизу прикладываются SBOM (CycloneDX, из requirements.lock) и список
# лицензий сторонних пакетов (pip-licenses по окружению из того же lock).
# Инструменты — из requirements-release.lock с хешами. Подпись .exe —
# необязательная: шаг идёт, только если в репозитории заведён секрет
# SIGN_CERT (PFX в base64) и SIGN_CERT_PASSWORD; без них .exe не подписан,
# и сводка сборки это говорит. Подробности — BUILD.md, «Подпись .exe».
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write        # gh release create/upload на теге; на PR не используется
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONIOENCODING: utf-8
      # Секрет в if шага не читается напрямую — только через env задания.
      # В PR из форков секретов нет: подпись честно пропускается.
      HAS_SIGN_CERT: ${{ secrets.SIGN_CERT != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Зависимости и PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip-audit -r requirements.lock --require-hashes --disable-pip

      - name: Сборка
        run: pyinstaller --noconfirm R7-Testovarka.spec

      - name: Подпись exe (если есть сертификат)
        # signtool из Windows SDK раннера, SHA256 и метка времени RFC 3161:
        # подпись остаётся действительной после истечения сертификата.
        # PFX живёт только на время шага во временной папке раннера.
        if: env.HAS_SIGN_CERT == 'true'
        env:
          SIGN_CERT: ${{ secrets.SIGN_CERT }}
          SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
          SIGN_TIMESTAMP_URL: ${{ vars.SIGN_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
                      Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe не найден в Windows Kits" }
          $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_CERT))
            & $signtool.FullName sign /f $pfx /p $env:SIGN_CERT_PASSWORD /fd SHA256 `
                /tr $env:SIGN_TIMESTAMP_URL /td SHA256 /d "R7-Testovarka" dist\R7-Testovarka.exe
            if ($LASTEXITCODE -ne 0) { throw "signtool sign: код $LASTEXITCODE" }
            & $signtool.FullName verify /pa /v dist\R7-Testovarka.exe
            if ($LASTEXITCODE -ne 0) { throw "signtool verify: код $LASTEXITCODE" }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }
          "Подпись .exe: есть (signtool, SHA256, метка времени)" >> $env:GITHUB_STEP_SUMMARY

      - name: Подпись пропущена
        if: env.HAS_SIGN_CERT != 'true'
        run: |
          "Подпись .exe: нет — секрет SIGN_CERT не задан (см. BUILD.md)" >> $env:GITHUB_STEP_SUMMARY

      - name: Самопроверка собранного exe
        # Импорт всех модулей пакета r7, шаблоны отчётов на месте, пробный
        # отчёт собирается. Без окна и без запроса прав.
        run: |
          $p = Start-Process -FilePath dist\R7-Testovarka.exe -ArgumentList "--self-check" `
                -NoNewWindow -Wait -PassThru -RedirectStandardOutput selfcheck.txt
          Get-Content selfcheck.txt -Encoding utf8
          if ($p.ExitCode -ne 0) { throw "self-check: код $($p.ExitCode)" }

      - name: SHA256 exe
        # Хеш рядом с артефактом: можно сверить скачанный файл. Строка — с LF:
        # Out-File дописывал CRLF, и `sha256sum -c` читал имя файла с CR на конце
        # («could not be read», релиз v1.1.0).
        run: |
          $h = (Get-FileHash dist\R7-Testovarka.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -NoNewline -Encoding ascii -Path dist\R7-Testovarka.exe.sha256 -Value "$h  R7-Testovarka.exe`n"
          "SHA256 R7-Testovarka.exe: ``$h``" >> $env:GITHUB_STEP_SUMMARY

      - name: Версия инструмента
        # Единственный источник — r7/version.py; на теге v* сверяется с ним.
        id: ver
        run: |
          $v = python -c "from r7.version import __version__; print(__version__)"
          if (-not $v) { throw "r7/version.py: версия не прочиталась" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "Версия инструмента: $v" >> $env:GITHUB_STEP_SUMMARY
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$v") {
            throw "тег ${{ github.ref_name }} не совпадает с r7/version.py (v$v)"
          }

      - name: Архив для развёртывания
        # Плоский архив: распаковал — и рядом с .exe уже есть все папки.
        # .keep в пустых папках: zip пустые папки не хранит.
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $stage = "stage"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item dist\R7-Testovarka.exe, dist\R7-Testovarka.exe.sha256, LICENSE $stage
          Copy-Item docs/rollout/README-first-run.md $stage
          foreach ($d in "Distributives", "TestFiles", "Reports") {
            New-Item -ItemType Directory -Force "$stage\$d" | Out-Null
            New-Item -ItemType File -Path "$stage\$d\.keep" | Out-Null
          }
          $zip = "dist\R7-Testovarka-$v-win64.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zip -CompressionLevel Optimal
          $h = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Set-Content -NoNewline -Encoding ascii -Path "$zip.sha256" -Value "$h  R7-Testovarka-$v-win64.zip`n"
          "SHA256 R7-Testovarka-$v-win64.zip: ``$h``" >> $env:GITHUB_STEP_SUMMARY
          Get-ChildItem dist

      - name: SBOM и лицензии сторонних пакетов
        # SBOM — по requirements.lock (то, из чего собран .exe), CycloneDX 1.6
        # JSON с проверкой схемы. Лицензии — по отдельному окружению из того же
        # lock, а не по окружению сборки: там ещё pyinstaller, pip-audit и
        # прочие инструменты, которых в .exe нет. Шаг идёт и на PR: релиз не
        # должен первым узнать, что инструмент сломался.
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          python -m venv "$env:RUNNER_TEMP\relenv"
          python -m venv "$env:RUNNER_TEMP\rtenv"
          $rel = "$env:RUNNER_TEMP\relenv\Scripts"
          $rt = "$env:RUNNER_TEMP\rtenv\Scripts\python.exe"
          & "$rel\python.exe" -m pip install --quiet --require-hashes -r requirements-release.lock
          if ($LASTEXITCODE -ne 0) { throw "requirements-release.lock: код $LASTEXITCODE" }
          & $rt -m pip install --quiet --require-hashes -r requirements.lock
          if ($LASTEXITCODE -ne 0) { throw "requirements.lock: код $LASTEXITCODE" }
          & "$rel\cyclonedx-py.exe" requirements requirements.lock --mc-type application `
              --output-reproducible --of JSON --validate -o "dist\R7-Testovarka-$v-sbom.cdx.json"
          if ($LASTEXITCODE -ne 0) { throw "cyclonedx-py: код $LASTEXITCODE" }
          $ignore = @("pip", "setuptools", "wheel")
          & "$rel\pip-licenses.exe" --python $rt --from mixed --with-urls --format markdown `
              --ignore-packages @ignore --output-file "dist\R7-Testovarka-$v-licenses.md"
          if ($LASTEXITCODE -ne 0) { throw "pip-licenses (список): код $LASTEXITCODE" }
          & "$rel\pip-licenses.exe" --python $rt --from mixed --format plain-vertical `
              --with-license-file --no-license-path --ignore-packages @ignore `
              --output-file "dist\R7-Testovarka-$v-THIRD-PARTY-LICENSES.txt"
          if ($LASTEXITCODE -ne 0) { throw "pip-licenses (тексты): код $LASTEXITCODE" }
          "Лицензии сторонних пакетов:" >> $env:GITHUB_STEP_SUMMARY
          Get-Content "dist\R7-Testovarka-$v-licenses.md" -Encoding utf8 >> $env:GITHUB_STEP_SUMMARY

      - name: Артефакт — SBOM и лицензии
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: R7-Testovarka-${{ steps.ver.outputs.version }}-sbom-licenses
          path: |
            dist/R7-Testovarka-*-sbom.cdx.json
            dist/R7-Testovarka-*-licenses.md
            dist/R7-Testovarka-*-THIRD-PARTY-LICENSES.txt
          retention-days: 14

      - name: Артефакт
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: R7-Testovarka-exe
          path: |
            dist/R7-Testovarka.exe
            dist/R7-Testovarka.exe.sha256
          retention-days: 14

      - name: Артефакт — архив
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: R7-Testovarka-${{ steps.ver.outputs.version }}-win64
          path: |
            dist/R7-Testovarka-*-win64.zip
            dist/R7-Testovarka-*-win64.zip.sha256
          retention-days: 14

      - name: GitHub Release (тег v*)
        # gh уже есть на раннере, токена workflow хватает (permissions выше).
        # Релиз, созданный вручную заранее, не трогается — файлы докладываются.
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $v = "${{ steps.ver.outputs.version }}"
          # pwsh 7.4+ с ErrorActionPreference=stop роняет шаг на ненулевом коде
          # native-команды — отсутствие релиза ловится через try/catch.
          $exists = $true
          try { gh release view $tag *> $null; if ($LASTEXITCODE -ne 0) { $exists = $false } }
          catch { $exists = $false }
          if (-not $exists) {
            # Текст — раздел CHANGELOG этой версии (r7/release_notes.py); нет
            # раздела — список PR от GitHub, как раньше.
            $notes = Join-Path $env:RUNNER_TEMP "release-notes.md"
            $hasNotes = $true
            try {
              python -m r7.release_notes $v --repo "${{ github.repository }}" --out $notes
              if ($LASTEXITCODE -ne 0) { $hasNotes = $false }
            } catch { $hasNotes = $false }
            if ($hasNotes) {
              gh release create $tag --verify-tag --notes-file $notes --title "R7-Testovarka $tag"
            } else {
              gh release create $tag --verify-tag --generate-notes --title "R7-Testovarka $tag"
            }
            if ($LASTEXITCODE -ne 0) { throw "gh release create: код $LASTEXITCODE" }
          }
          gh release upload $tag --clobber `
            dist\R7-Testovarka.exe dist\R7-Testovarka.exe.sha256 `
            "dist\R7-Testovarka-$v-win64.zip" "dist\R7-Testovarka-$v-win64.zip.sha256" `
            "dist\R7-Testovarka-$v-sbom.cdx.json" "dist\R7-Testovarka-$v-licenses.md" `
            "dist\R7-Testovarka-$v-THIRD-PARTY-LICENSES.txt"
          if ($LASTEXITCODE -ne 0) { throw "gh release upload: код $LASTEXITCODE" }
