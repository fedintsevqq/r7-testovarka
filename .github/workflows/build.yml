name: build-exe

# Сборка портативного R7-Testovarka.exe и самопроверка собранного файла:
# PyInstaller молча теряет модули, импортируемые не напрямую, и папку
# шаблонов отчётов — без этой проверки это выяснялось у пользователя при
# первом отчёте (docs/plan-to-10.md, шаг 5).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Зависимости и PyInstaller
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Сборка
        run: pyinstaller --noconfirm R7-Testovarka.spec

      - name: Самопроверка собранного exe
        # Импорт всех модулей пакета r7, шаблоны отчётов на месте, пробный
        # отчёт собирается. Без окна и без запроса прав.
        run: |
          $p = Start-Process -FilePath dist\R7-Testovarka.exe -ArgumentList "--self-check" `
                -NoNewWindow -Wait -PassThru -RedirectStandardOutput selfcheck.txt
          Get-Content selfcheck.txt -Encoding utf8
          if ($p.ExitCode -ne 0) { throw "self-check: код $($p.ExitCode)" }

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: R7-Testovarka-exe
          path: dist/R7-Testovarka.exe
          retention-days: 14
