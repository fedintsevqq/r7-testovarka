name: perf-smoke

# Живой прогон на настоящем Р7-Офис. Нужен self-hosted раннер с метками
# windows и r7-installed, запущенный В ИНТЕРАКТИВНОЙ СЕССИИ (не службой):
# инструмент жмёт клавиши и читает окна через UI Automation, а у службы
# (сессия 0) рабочего стола нет. Как поднять раннер — docs/ci-runner.md.
#
# Ручной запуск (workflow_dispatch) и раз в сутки ночью — не на каждый push:
# прогон занимает минуты и трогает реальный Р7 на машине раннера, в отличие
# от tests.yml (секунды, без побочных эффектов).
on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

# Ночной и ручной запуск одновременно дрались бы за один Р7 и CDP-порт.
concurrency:
  group: perf-r7
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: [self-hosted, windows, r7-installed]
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell
    env:
      # Python для окружения раннера. В PATH стенда первым может стоять
      # другой Python без зависимостей — поэтому отдельное окружение.
      # Переопределяется переменной репозитория R7_CI_PYTHON.
      CI_PYTHON: ${{ vars.R7_CI_PYTHON || 'python' }}
      PY: .venv-ci\Scripts\python.exe
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Окружение Python
        run: |
          if (!(Test-Path $env:PY)) { & $env:CI_PYTHON -m venv .venv-ci }
          & $env:PY -m pip install -q --disable-pip-version-check --require-hashes -r requirements.lock

      - name: Предусловия стенда
        # Падает с понятной причиной до любого действия с Р7: раннер-служба
        # без рабочего стола, Р7 уже открыт (CDP-порт занят, клавиши ушли бы
        # не туда), нет CDP-пакетов.
        run: '& $env:PY tests/ci_preflight.py'

      - name: Генерация фикстуры
        # *.xlsx в репозиторий не коммитятся (.gitignore); seed фиксирован —
        # файл одинаковый от прогона к прогону (QA-аудит 29.09.2026, G-10).
        run: >
          & $env:PY -c "import r7_Testovarka as m;
          m.R7Testovarka.__new__(m.R7Testovarka)._generate_fixture('test_10k.xlsx', rows=10000)"

      - name: Живой прогон CDP-операций на Р7-Офис
        run: '& $env:PY tests/manual_cdp_smoke.py test_10k.xlsx'

      - name: Живой pytest-набор (открытие, CDP, экспорт, аварийное закрытие)
        env:
          R7_LIVE: "1"
        run: '& $env:PY -m pytest -m live tests/live -v -p no:cacheprovider'

      - name: Ночной прогон и сравнение с прошлой ночью
        # Быстрый набор (5 тестов) на рабочей фикстуре и сравнение с прошлым
        # ночным отчётом тем же критерием, что «Сравнить версии». Код 2 —
        # регрессия: шаг падает, запуск помечен. Отчёты — вне рабочей копии:
        # checkout чистит неотслеживаемые файлы, а сравнивать нужно с прошлой ночью.
        run: '& $env:PY tests/nightly_local.py --quick --dir (Join-Path $env:USERPROFILE "r7-nightly")'

      - name: Сводка сравнения
        if: always()
        run: |
          $f = Join-Path $env:USERPROFILE "r7-nightly/nightly_last.txt"
          if (Test-Path $f) {
            '```' | Add-Content $env:GITHUB_STEP_SUMMARY
            Get-Content $f -Encoding utf8 | Add-Content $env:GITHUB_STEP_SUMMARY
            '```' | Add-Content $env:GITHUB_STEP_SUMMARY
          }

      - name: Закрыть Р7 при любом исходе
        # Правило 10 CLAUDE.md: упавший шаг мог оставить Р7 открытым, и
        # следующий ночной прогон упёрся бы в занятый CDP-порт.
        if: always()
        run: >
          & $env:PY -c "import r7_Testovarka as m;
          a = m.R7Testovarka.__new__(m.R7Testovarka); a._r7_pids = None;
          a.add_test_log = print;
          ok = a._terminate_r7_processes();
          print('Р7 закрыт' if ok else 'Р7 НЕ закрылся'); raise SystemExit(0 if ok else 1)"

      - name: Отчёты прогона
        # Всегда, а не только при падении: ночной замер нужен и когда всё
        # прошло — для трендов.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf-smoke-${{ github.run_number }}
          path: Reports/
          if-no-files-found: ignore
          retention-days: 14
