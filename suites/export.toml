# Экспорт через конвертер x2t: четыре формата по 3 повтора. Один повтор
# на фикстуре 50К — до полутора минут. ODS на 50К роняет x2t (DE-8304).

[suite]
name = "export"
description = "Четыре экспорта через x2t по 3 повтора — проверка конвертера, ~20 минут"

[tests]
"Сохранение в PDF (конвертация x2t)" = 3
"Сохранение в ODS (конвертация x2t)" = 3
"Сохранение в CSV (конвертация x2t)" = 3
"Сохранение в XLTX (конвертация x2t)" = 3

[compare]
min_effect_pct = 10
