# Полный набор: все 17 тестов с повторами по умолчанию (открытие 5,
# операции правки 7, экспорт 3). На фикстуре 50К идёт около 45 минут.
# Экспорт в ODS на 50К роняет x2t (баг Р7 DE-8304, см. CLAUDE.md) —
# в отчёте он будет с ошибкой, и релиз получит «Не готов»: уберите строку,
# если этот баг для вашей сборки известен.

[suite]
name = "release"
description = "Все 17 тестов с повторами по умолчанию — проверка перед релизом, ~45 минут"

[tests]
"Повторное открытие файла" = 5
"Выделение всех ячеек (Ctrl+A)" = 7
"Копирование всех ячеек (Ctrl+C)" = 7
"Вставка большого массива (Ctrl+V)" = 7
"Добавление нового листа" = 7
"Добавление столбца (горячие клавиши)" = 7
"Добавление столбца (меню Вставка)" = 7
"Вставка 1 ячейки (горячие клавиши)" = 7
"Вставка 5 ячеек (горячие клавиши)" = 7
"Вставка 1 ячейки (ПКМ)" = 7
"Вставка 5 ячеек (ПКМ)" = 7
"Функция ВПР (50K строк)" = 7
"Удаление столбца (Del)" = 7
"Сохранение в PDF (конвертация x2t)" = 3
"Сохранение в ODS (конвертация x2t)" = 3
"Сохранение в CSV (конвертация x2t)" = 3
"Сохранение в XLTX (конвертация x2t)" = 3

# Бюджеты — потолки с запасом над цифрами стенда (schema 9, 07.10.2026):
# открытие 9 с, на медленном системном диске до 12–14 с; вставка 20–23 с.
# Подстройте под свой стенд по Reports/baseline/.
[budgets]
"Повторное открытие файла" = 15.0
"Вставка большого массива (Ctrl+V)" = 30.0

[compare]
min_effect_pct = 10
