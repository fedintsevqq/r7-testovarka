# Дымовой набор: открытие и три ключевые операции. Запуск:
#   python -m r7 run --suite suites/smoke.toml --gate --junit Reports/junit.xml
# Имена тестов — точно как в TEST_DEFINITIONS (r7_Testovarka.py); число —
# повторы (1..20). Формат описан в docs/cli.md.

[suite]
name = "smoke"
description = "Открытие файла и три ключевые операции — быстрая проверка сборки, ~5 минут"

[tests]
"Повторное открытие файла" = 3
"Выделение всех ячеек (Ctrl+A)" = 5
"Вставка большого массива (Ctrl+V)" = 5
"Функция ВПР (50K строк)" = 5

# Бюджеты — абсолютный потолок медианы в секундах; выше — «Не готов».
# Пример (снять комментарий и подставить цифры своего стенда):
# [budgets]
# "Повторное открытие файла" = 12.0

[compare]
min_effect_pct = 10
